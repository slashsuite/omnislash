<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>OmniSlash is offline</title>
<style>
html{background:#181825;color:#cdd6f4}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
main{max-width:26rem;padding:1.5rem}
h1{font-size:1.25rem;margin:1rem 0 .5rem}
p{margin:.5rem 0;color:#a6adc8}
img{width:4rem;height:4rem}
button{margin-top:1rem;padding:.6rem 1.2rem;border:1px solid #585b70;border-radius:.5rem;background:#313244;color:inherit;font:inherit}
</style>
</head>
<body>
<main>
<img src="/omnislash-logo-light.svg" alt="">
<h1>OmniSlash is offline</h1>
<p>The OmniSlash dashboard needs a connection to your server, and it shows live data only. Nothing is stored on this device, so there is no stale view to fall back on.</p>
<p>Join your home Wi-Fi or reconnect, then try again.</p>
<button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: in a pull request moon diffs the head against the base branch before any task
      # runs, and a shallow checkout has no `main`, so the gate died with "ambiguous argument 'main'".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bunx moon run --concurrency 3 :typecheck :test :lint ob-dashboard:build-storybook
        env:
          MOON_BASE: origin/main
      # OS-174: docs/role-state-machine.json and .mmd are generated from platform/state-machine/src/role.ts.
      # A change to the machine without the regenerated files fails here.
      - run: bunx moon run state-machine:export -- --check
      - run: bun scripts/check-workflows.ts .github/workflows/*.yml
      - run: bun test scripts

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: in a pull request moon diffs the head against the base branch before any task
      # runs, and a shallow checkout has no `main`, so the gate died with "ambiguous argument 'main'".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # OS-210: the steps live in the repo's gate.json, and this runs them through the same command a builder
      # runs locally (`ob gate run`), so the local gate and CI cannot disagree. gate.json carries MOON_BASE and
      # the state-machine export check (OS-174) and the hosted-runner check.
      - run: bun apps/cli/src/index.ts gate run

  # OS-211 (OS-112): TLC model-checks the spinoff row lifecycle (platform/state-machine/model/Spinoff.tla).
  # The gate's state-machine tests keep the model's edges, states and events equal to the machine's; TLC then
  # checks the rules (no handoff of commits without a PR, no stale verdict, failed stays failed) over those
  # edges. The guards in code are pinned by cli-coord's tests, not by this job. About a second.
  tla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: bash platform/state-machine/model/tlc.sh

[test]
# OB-2167: warm.ts builds the Postgres cluster before any test (OB-2021). Without it the first pg test pays
# initdb inside its own budget; under load it timed out, bun SIGTERMed the postmaster as a dangling child,
# and every later pg test in the run met a cluster that was shutting down.
preload = ["../../apps/cli/test/preload.ts", "../../apps/cli/test/pg/warm.ts"]

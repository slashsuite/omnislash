$schema: '../../.moon/cache/schemas/project.json'

# OS-168: the item and spinoff lifecycles as XState v5 machines, used as pure functions only
# (docs/spikes/state-machine-library.md). OS-169: cli and cli-coord call them (the shadow check), so they
# depend on this project, not the other way round. OS-173: cli-coord's moveSpinoff moves by the spinoff
# machine's events through src/apply.ts. The parity test still reads apps/cli/src/status.ts and
# platform/cli-coord; every ob-ts task hashes the whole workspace, so a change there still re-runs it.
tags: ['ob-ts']

tasks:
  test:
    script: 'bun --bun vitest run ${OB_TEST_REPORT_DIR:+--reporter=default --reporter=junit --outputFile.junit=$OB_TEST_REPORT_DIR/state-machine.xml}'
  typecheck:
    command: 'bunx tsc --noEmit'
  # OS-174: writes docs/role-state-machine.json and .mmd from src/role.ts. `-- --check` writes nothing and
  # fails when the committed copies drift (ci.yml runs it). Never cached: it reads and writes files outside
  # its own hash, and a check must always run.
  export:
    command: 'bun src/export.ts'
    options:
      cache: false
